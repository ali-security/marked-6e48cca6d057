name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Jasmine spec files to run (passed as `npm test -- <files>`); empty runs the full suite'
        type: string
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 30
    strategy:
      matrix:
        node_version: ['lts/*', 'node']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- ${{ inputs.test-filter }}
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            echo "test-filter set; selected tests already ran in the previous step"
          else
            npm run test:specs
          fi
      - name: Build 🗜️
        if: matrix.node_version == 'lts/*'
        run: npm run build
      - name: Pack
        if: matrix.node_version == 'lts/*'
        run: npm pack
      - name: Upload Artifact
        if: matrix.node_version == 'lts/*'
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: marked-*.tgz
          if-no-files-found: error

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
